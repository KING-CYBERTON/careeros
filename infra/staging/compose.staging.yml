# CAREEROS: P0-C03 staging stack. Modeled on upstream compose.yml. No service publishes host ports;
# public traffic arrives only through the cloudflared tunnel (outbound connection to Cloudflare).
name: careeros_staging

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    networks:
      - data_network
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

  # CAREEROS: P1-C01. One-shot, idempotent: creates/normalises careeros_owner and careeros_app (see README "Database roles").
  db_bootstrap:
    image: postgres:16
    restart: "no"
    networks:
      - data_network
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CAREEROS_OWNER_PASSWORD: ${CAREEROS_OWNER_PASSWORD:?set CAREEROS_OWNER_PASSWORD in .env}
      CAREEROS_APP_PASSWORD: ${CAREEROS_APP_PASSWORD:?set CAREEROS_APP_PASSWORD in .env}
    volumes:
      - ./bootstrap-roles.sql:/bootstrap/bootstrap-roles.sql:ro
    entrypoint: >
      /bin/sh -c "
        PGOPTIONS=\"-c careeros.owner_password=$$CAREEROS_OWNER_PASSWORD -c careeros.app_password=$$CAREEROS_APP_PASSWORD\"
        export PGOPTIONS
        psql -v ON_ERROR_STOP=1 --quiet --file /bootstrap/bootstrap-roles.sql
      "
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - data_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 5s
      interval: 30s
      timeout: 10s
      retries: 3

  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    command: server -s3 -filer -dir=/data -ip=0.0.0.0
    networks:
      - storage_network
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8888"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

  seaweedfs_create_bucket:
    image: amazon/aws-cli:2.39.3
    restart: on-failure
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket ${S3_BUCKET:-reactive-resume} 2>/dev/null ||
        aws --endpoint-url http://seaweedfs:8333 s3 mb s3://${S3_BUCKET:-reactive-resume}
      "
    networks:
      - storage_network
    depends_on:
      seaweedfs:
        condition: service_healthy

  app:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}:${IMAGE_TAG:?set IMAGE_TAG}
    restart: unless-stopped
    networks:
      - edge_network
      - data_network
      - storage_network
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      db_bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seaweedfs_create_bucket:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    networks:
      - edge_network
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:

networks:
  # app <-> cloudflared only; has outbound access so the tunnel (and the app) can reach the internet.
  edge_network:
  # Internal networks: no route to the outside world.
  data_network:
    internal: true
  storage_network:
    internal: true
