# CAREEROS: P0-C01 — CareerOS CI gate. Upstream ci.yml is disabled in Actions settings (see docs/UPSTREAM_PATCHES.md).
name: careeros-ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # CAREEROS: P1-C05. Decides whether the heavy jobs run their steps. Plain git and bash, no third-party action.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      # CAREEROS: P5-C01. true when the clipper, a package it imports, this workflow or the lockfiles changed.
      extension: ${{ steps.detect.outputs.extension }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # CAREEROS: full history (this job is cheap) so the base commit is present without a credentialed fetch.
          fetch-depth: 0

      - name: Detect docs-only change
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          # Anything unclear falls back to code=true so no code change ever skips tests.
          fallback() { echo "$1; running the full checks"; { echo "code=true"; echo "extension=true"; } >> "$GITHUB_OUTPUT"; exit 0; }
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) fallback "event $EVENT_NAME has no base" ;;
          esac
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then fallback "no usable base commit"; fi
          # The base commit comes from the full-history checkout; persist-credentials is false, so no later fetch.
          git cat-file -e "$base^{commit}" 2>/dev/null || fallback "base $base is not in the local history"
          # --no-renames lists both sides of a rename, so moving code into docs/ still counts as code.
          git -c core.quotepath=off diff --name-only --no-renames "$base" HEAD > changed-files.txt || fallback "git diff failed"
          echo "Changed files:"
          cat changed-files.txt
          result="$(bash tooling/ci/classify-changes.sh < changed-files.txt)" || fallback "classifier failed"
          echo "$result" | tee -a "$GITHUB_OUTPUT"
          # CAREEROS: P5-C01. The clipper (apps/extension), the packages it imports (ui, utils and their config), the
          # branding word list its pack checks reuse, this workflow, and the lockfile and workspace files.
          if grep -Eq '^(apps/extension/|packages/(ui|utils|config)/|tooling/careeros/branding-gate\.mjs$|\.github/workflows/careeros-ci\.yml$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$)' changed-files.txt; then
            echo "extension=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "extension=false" | tee -a "$GITHUB_OUTPUT"
          fi

  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # CAREEROS: P1-C05. Persist Turborepo's local cache across runs. Live-database test:ci tasks opt out in turbo.json.
      - name: Restore and save Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check package boundaries
        run: pnpm exec turbo boundaries

      - name: Typecheck (mobile excluded)
        run: pnpm exec turbo run typecheck --filter=!mobile

      # CAREEROS: P2-C02. Upstream product names and brand links must not come back (docs/CODING-STANDARDS.md, "Branding gate").
      - name: Check upstream branding
        run: node tooling/careeros/branding-gate.mjs

      # CAREEROS: P2-C02. The mobile node tests and the gate's own tests; they were not run in CI before.
      # P2-C01 adds the staging Cloudflare script's self-test. P2-C03 adds the skipped-database-suites guard's self-test
      # (it is picked up by the tooling/careeros glob).
      - name: Node tests (mobile scripts and tooling)
        run: node --test infra/staging/*.test.mjs tooling/careeros/*.test.mjs apps/mobile/scripts/*.test.mjs

  # CAREEROS: P1-C05. Unit tests are sharded across runners; each shard runs its turbo tasks serially, because
  # concurrent suites on one 4-vCPU runner caused cold-import timeouts. The aggregate job `unit` keeps the check name.
  unit-shard:
    name: unit (${{ matrix.shard }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: pdf
            filter: --filter=@reactive-resume/pdf
            guard: --include=packages/pdf
          - shard: api
            filter: --filter=@reactive-resume/api
            guard: --include=packages/api
          - shard: rest
            filter: --filter=!mobile --filter=!@reactive-resume/pdf --filter=!@reactive-resume/api
            guard: --exclude=packages/pdf,packages/api,apps/mobile
    env:
      APP_URL: http://localhost:3000
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Public fixtures for disposable CI services. Random values invalidate every Turbo test key.
      AUTH_SECRET: isolated-ci-auth-secret-32-characters
      ENCRYPTION_SECRET: isolated-ci-encryption-secret-32-characters
      FLAG_DISABLE_SIGNUPS: "false"
      FLAG_DISABLE_EMAIL_AUTH: "false"
      FLAG_ENABLE_GUEST_LOGIN: "true"
      FLAG_DISABLE_API_RATE_LIMIT: "true"
      LOCAL_STORAGE_PATH: /tmp/reactive-resume-e2e-storage
      FLAG_ALLOW_UNSAFE_AI_BASE_URL: "true"
      COVER_LETTER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      INTEGRATIONS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      OAUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oauth_test
      # CAREEROS: used by P0-Q01 (owner and careeros_app connections); unused until it lands.
      CAREEROS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CAREEROS_TEST_APP_DATABASE_URL: postgresql://careeros_app:careeros_app@localhost:5432/postgres
      CAREEROS_TEST_APP_ROLE_PASSWORD: careeros_app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # CAREEROS: P1-C05. The job still runs and reports success on a docs-only change, because branch protection
      # requires it by name. Every other step is guarded by the same condition.
      - name: Docs-only change
        if: needs.changes.outputs.code != 'true'
        run: echo "docs-only change, tests skipped"

      - name: Check out source
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # CAREEROS: P1-C05. Persist Turborepo's local cache across runs. Live-database test:ci tasks opt out in turbo.json.
      - name: Restore and save Turbo cache
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install PDF text extraction tools
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 poppler-utils; then
              exit 0
            fi
            echo "apt attempt $attempt failed" >&2
            sleep 5
          done
          exit 1

      - name: Prepare test storage
        if: needs.changes.outputs.code == 'true'
        run: mkdir -p "$LOCAL_STORAGE_PATH"

      - name: Migrate test database
        if: needs.changes.outputs.code == 'true'
        run: pnpm db:migrate

      - name: Create and migrate OAuth test database
        if: needs.changes.outputs.code == 'true'
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE oauth_test"
          DATABASE_URL="$OAUTH_TEST_DATABASE_URL" pnpm db:migrate

      # CAREEROS: runs only once P0-Q01 adds the script, so this workflow can merge first.
      - name: Create test database roles (if present)
        if: needs.changes.outputs.code == 'true'
        run: |
          if node -e "const p=require('./packages/careeros-testing/package.json'); process.exit(p.scripts && p.scripts['db:test-role'] ? 0 : 1)" 2>/dev/null; then
            pnpm --filter @careeros/testing db:test-role
          else
            echo "db:test-role not present yet; skipping"
          fi

      - name: Run unit tests (${{ matrix.shard }} shard)
        if: needs.changes.outputs.code == 'true'
        run: pnpm exec turbo run test:ci --concurrency=1 ${{ matrix.filter }}

      # CAREEROS: P2-C03. Fails when a *.integration.test.ts file skipped any test (for example because Turborepo strict
      # env mode hid the database URLs from a package). Reads the JUnit reports test:ci wrote. Allowlist is in the script.
      # Each shard checks only the packages its turbo filter ran (matrix.guard), so a package run in another shard is
      # not reported as missing a report.
      - name: Fail on skipped database suites
        if: needs.changes.outputs.code == 'true'
        run: node tooling/careeros/skipped-db-suites.mjs ${{ matrix.guard }}

      # CAREEROS: P1-C02. Per-package counts on the run page. The script catches its own errors and exits 0.
      - name: Test summary
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        run: node tooling/ci/junit-summary.mjs

      # CAREEROS: P1-C02
      - name: Upload unit JUnit reports
        if: ${{ always() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-junit-${{ matrix.shard }}
          path: |
            packages/*/reports/**/*.xml
            apps/*/reports/**/*.xml
          if-no-files-found: ignore
          retention-days: 14

  # CAREEROS: P5-C01. Builds the Job Clipper and proves it packs (pack checks run inside `pack`). Like the unit shards,
  # the job always reports, and every step is skipped when nothing the clipper depends on changed. The `unit` gate
  # needs it, so it is part of a required check without a change to the repository settings.
  extension:
    name: extension
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clipper unchanged
        if: needs.changes.outputs.extension != 'true'
        run: echo "no clipper change, build skipped"

      - name: Check out source
        if: needs.changes.outputs.extension == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        if: needs.changes.outputs.extension == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: needs.changes.outputs.extension == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        if: needs.changes.outputs.extension == 'true'
        run: pnpm install --frozen-lockfile

      # `run pack`, not `pack`: bare `pnpm pack` is pnpm's own command.
      - name: Build and pack the clipper
        if: needs.changes.outputs.extension == 'true'
        run: pnpm --filter extension run pack

      - name: Upload the clipper zip
        if: needs.changes.outputs.extension == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: job-clipper-zip
          path: apps/extension/job-clipper-*.zip
          if-no-files-found: error
          retention-days: 14

  # CAREEROS: P1-C05. Stable check name for branch protection. Passes when every shard passed; a docs-only change
  # makes each shard succeed without running tests.
  unit:
    name: unit
    # CAREEROS: P5-C01. `extension` is part of this gate.
    needs: [changes, unit-shard, extension]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every unit shard to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SHARD_RESULT: ${{ needs.unit-shard.result }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
        run: |
          echo "changes: $CHANGES_RESULT, unit shards: $SHARD_RESULT, extension: $EXTENSION_RESULT"
          if [ "$CHANGES_RESULT" != "success" ] || [ "$SHARD_RESULT" != "success" ] || [ "$EXTENSION_RESULT" != "success" ]; then
            echo "unit shards or the extension job did not all succeed" >&2
            exit 1
          fi

  e2e:
    name: e2e
    needs: [changes, static]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_URL: http://localhost:3000
      PORT: "3000"
      # CAREEROS: P1-C01 role split. The app runs as careeros_app; migrations run as careeros_owner.
      # Passwords are public, disposable CI-only values (same as the unit job's careeros_app fixture).
      DATABASE_URL: postgresql://careeros_app:careeros_app@localhost:5432/postgres
      DATABASE_MIGRATION_URL: postgresql://careeros_owner:careeros_owner@localhost:5432/postgres
      SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CAREEROS_OWNER_PASSWORD: careeros_owner
      CAREEROS_APP_PASSWORD: careeros_app
      AUTH_SECRET: isolated-ci-auth-secret-32-characters
      ENCRYPTION_SECRET: isolated-ci-encryption-secret-32-characters
      FLAG_DISABLE_SIGNUPS: "false"
      FLAG_DISABLE_EMAIL_AUTH: "false"
      FLAG_ENABLE_GUEST_LOGIN: "true"
      FLAG_DISABLE_API_RATE_LIMIT: "true"
      LOCAL_STORAGE_PATH: /tmp/reactive-resume-e2e-storage
      FLAG_ALLOW_UNSAFE_AI_BASE_URL: "true"
      # CAREEROS: P3-T06. The billing e2e (careeros-billing.spec.ts) runs the built server (NODE_ENV=production) against
      # the fake provider; the flag lets that start. Test-only values; never set on a public deployment.
      BILLING_PROVIDER: fake
      BILLING_FAKE_SECRET: isolated-ci-billing-fake-secret-32-chars
      FLAG_ALLOW_FAKE_BILLING: "true"
      # CAREEROS: P2-T05. Organization hosts for the sign-in handoff e2e (careeros-auth-handoff.spec.ts). No e2e host
      # on localhost matches the pattern, so the other specs are unaffected. The Google values are placeholders: the
      # provider is enabled so `begin` accepts it, but the spec never contacts it (the issue step is seeded).
      ORG_HOST_PATTERN: "{slug}.orgs.test"
      GOOGLE_CLIENT_ID: e2e-placeholder-client-id
      GOOGLE_CLIENT_SECRET: e2e-placeholder-client-secret
      COVER_LETTER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      INTEGRATIONS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      OAUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oauth_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # CAREEROS: P1-C05. The job still runs and reports success on a docs-only change, because branch protection
      # requires it by name. Every other step is guarded by the same condition.
      - name: Docs-only change
        if: needs.changes.outputs.code != 'true'
        run: echo "docs-only change, tests skipped"

      - name: Check out source
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # CAREEROS: P1-C05. Persist Turborepo's local cache across runs. Live-database test:ci tasks opt out in turbo.json.
      - name: Restore and save Turbo cache
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', '.nvmrc') }}-

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install PDF text extraction tools
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 poppler-utils; then
              exit 0
            fi
            echo "apt attempt $attempt failed" >&2
            sleep 5
          done
          exit 1

      - name: Install Chromium and browser dependencies
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare test storage
        if: needs.changes.outputs.code == 'true'
        run: mkdir -p "$LOCAL_STORAGE_PATH"

      # CAREEROS: P1-C01. Run twice on purpose: the bootstrap must be idempotent.
      - name: Create database roles (careeros_owner, careeros_app)
        if: needs.changes.outputs.code == 'true'
        run: |
          infra/db/bootstrap-roles.sh
          infra/db/bootstrap-roles.sh

      # CAREEROS: P1-C01. drizzle.config.ts reads only DATABASE_URL, so the migration URL is passed in for this step only.
      - name: Migrate test database (as careeros_owner)
        if: needs.changes.outputs.code == 'true'
        run: DATABASE_URL="$DATABASE_MIGRATION_URL" pnpm db:migrate

      - name: Assert the app role is least-privilege
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          row="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select current_user, rolsuper, rolbypassrls from pg_roles where rolname = current_user")"
          test "$row" = "careeros_app|f|f" || { echo "unexpected app role state: $row" >&2; exit 1; }
          owned="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from pg_tables where schemaname = 'public' and tableowner = 'careeros_app'")"
          test "$owned" = "0" || { echo "careeros_app owns $owned table(s) in public" >&2; exit 1; }
          tables="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from pg_tables where schemaname = 'public'")"
          test "$tables" -gt 0 || { echo "no tables found in public after migration" >&2; exit 1; }

      - name: Build application
        if: needs.changes.outputs.code == 'true'
        run: pnpm build

      - name: Run browser tests
        if: needs.changes.outputs.code == 'true'
        run: pnpm exec playwright test --workers=1

      - name: Upload browser test reports and traces
        if: ${{ failure() && needs.changes.outputs.code == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
