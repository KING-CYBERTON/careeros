# CAREEROS: P0-C04 — Dependabot targets develop; commit prefix is commitlint-compatible.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
