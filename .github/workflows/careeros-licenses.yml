# CAREEROS: P0-C04 — production dependency license report with deny-list check.
name: careeros-licenses

on:
  push:
    branches: [develop]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Produce production license report
        run: pnpm licenses list --prod -r --json > license-report.json

      - name: Upload license report
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: license-report.json
          if-no-files-found: error

      - name: Check deny-listed licenses
        run: node .github/scripts/check-licenses.mjs license-report.json
